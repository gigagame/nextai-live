<style>
:root{--bg:#070b14;--text:#f4f7fb;--muted:#9eabc0;--line:rgba(255,255,255,.1);--a:#66e3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,rgba(102,227,255,.12),transparent 30%),#070b14;color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}.box{width:min(760px,92%);padding:42px;border:1px solid var(--line);border-radius:24px;background:rgba(13,20,34,.88);text-align:center}.code{font-size:13px;letter-spacing:.15em;color:var(--a);font-weight:900}h1{font-size:clamp(40px,7vw,68px);line-height:1;margin:14px 0 18px;letter-spacing:-.05em}p{color:var(--muted);font-size:18px;line-height:1.65}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}.btn{display:inline-block;padding:13px 18px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:#fff;font-weight:800}.primary{background:linear-gradient(100deg,#7c3aed,#3b82f6);border-color:transparent}

<!-- 2NextAI GA4 interaction and funnel tracking -->
<script>
(function () {
  if (window.__twoNextAiTrackingInstalled) return;
  window.__twoNextAiTrackingInstalled = true;
  var send = function(name, params) {
    if (typeof window.gtag === 'function') window.gtag('event', name, params || {});
  };
  var page = window.location.pathname || '/';
  if (page === '/thank-you.html') send('thank_you_page_view', {page_type:'thank_you'});
  document.addEventListener('click', function(event) {
    var link = event.target && event.target.closest ? event.target.closest('a[href]') : null;
    if (!link) return;
    var href = link.href, url;
    try { url = new URL(href, window.location.href); } catch(e) { return; }
    var label = (link.innerText || link.getAttribute('aria-label') || link.title || '').trim().replace(/\s+/g, ' ').slice(0,120);
    var params = {link_url:href, link_text:label, link_domain:url.hostname, page_location:window.location.href};
    var external = (url.protocol === 'http:' || url.protocol === 'https:') && url.hostname !== window.location.hostname;
    var paypal = /(^|\.)paypal\.com$/i.test(url.hostname);
    var download = link.hasAttribute('download') || /\.pdf(?:$|[?#])/i.test(url.pathname);
    var affiliate = link.hasAttribute('data-affiliate') || /affiliate|aff=|ref=|referral|partner/i.test(href);
    var cta = /\b(btn|button|cta)\b/i.test(String(link.className || '')) || /buy|get instant access|subscribe|purchase|download|start free|view product|explore|access/i.test(label);
    if (paypal) send('payment_provider_click', Object.assign({payment_provider:'PayPal'}, params));
    if (download) send('file_download', Object.assign({file_name:url.pathname.split('/').pop(), file_extension:(url.pathname.split('.').pop() || '').toLowerCase()}, params));
    if (affiliate) send('affiliate_click', params);
    if (external) {
      send('outbound_click', params);
      if (page.indexOf('/tools/') === 0) send('tool_referral_click', params);
    }
    if (cta) send('cta_click', params);
  }, true);
})();
</script>
